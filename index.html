<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: #f4f4f2;
color: #1a1a1a;
font-family: ‘Space Mono’, monospace;
min-height: 100vh;
padding-bottom: 80px;
}

.site-header {
background: #ffffff;
border-bottom: 1px solid #e2e2de;
padding: 14px 20px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
}

.site-title {
font-size: 13px;
font-weight: 700;
letter-spacing: 0.2em;
text-transform: uppercase;
flex-shrink: 0;
}

.header-right { display: flex; align-items: center; gap: 8px; }

.btn-reset {
font-family: ‘Space Mono’, monospace;
font-size: 9px;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
color: #c93b2e;
background: #fff0ee;
border: 1px solid #f0c0ba;
border-radius: 20px;
padding: 5px 12px;
cursor: pointer;
}

.btn-pdf {
font-family: ‘Space Mono’, monospace;
font-size: 9px;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
color: #ffffff;
background: #1a1a1a;
border: none;
border-radius: 20px;
padding: 5px 12px;
cursor: pointer;
}

.main {
max-width: 580px;
margin: 0 auto;
padding: 20px 16px;
display: flex;
flex-direction: column;
gap: 12px;
}

/* ── BALANCE HERO ── */
.balance-hero {
background: #1a1a1a;
border-radius: 12px;
padding: 24px 20px 20px;
color: #ffffff;
}

.balance-period {
font-size: 9px;
font-weight: 700;
letter-spacing: 0.2em;
text-transform: uppercase;
color: #8a8a86;
margin-bottom: 6px;
}

.balance-amount {
font-size: 48px;
font-weight: 700;
letter-spacing: -0.03em;
line-height: 1;
margin-bottom: 4px;
}

.balance-amount.positive { color: #7bbf90; }
.balance-amount.negative { color: #f08070; }

.balance-sub {
font-size: 11px;
color: #8a8a86;
margin-bottom: 20px;
}

.balance-grid {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 1px;
background: #2e2e2e;
border-radius: 8px;
overflow: hidden;
}

.balance-cell {
background: #242424;
padding: 12px 14px;
}

.balance-cell-label {
font-size: 8px;
font-weight: 700;
letter-spacing: 0.15em;
text-transform: uppercase;
color: #8a8a86;
margin-bottom: 4px;
}

.balance-cell-val {
font-size: 14px;
font-weight: 700;
}

.balance-cell-val.green { color: #7bbf90; }
.balance-cell-val.red   { color: #f08070; }
.balance-cell-val.gold  { color: #c8a84c; }

/* ── CARD ── */
.card {
background: #ffffff;
border: 1px solid #e2e2de;
border-radius: 10px;
overflow: hidden;
}

.card-header {
padding: 12px 18px;
border-bottom: 1px solid #e2e2de;
display: flex;
align-items: center;
justify-content: space-between;
}

.card-title {
font-size: 9px;
font-weight: 700;
letter-spacing: 0.2em;
text-transform: uppercase;
color: #8a8a86;
}

/* ── DEPOSITS ── */
.deposit-list { padding: 0 18px; }

.deposit-item {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 0;
border-bottom: 1px solid #f0f0ee;
}

.deposit-item:last-child { border-bottom: none; }

.deposit-label {
flex: 1;
font-size: 12px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.05em;
}

.deposit-date {
font-size: 10px;
color: #8a8a86;
min-width: 60px;
text-align: right;
}

.deposit-amount {
font-size: 13px;
font-weight: 700;
color: #267a2a;
min-width: 80px;
text-align: right;
}

.deposit-del {
background: none;
border: none;
font-size: 15px;
color: #c8c8c2;
cursor: pointer;
padding: 0 2px;
line-height: 1;
}

.deposit-del:hover { color: #c93b2e; }

.deposit-add-row {
display: flex;
gap: 8px;
padding: 12px 18px;
border-top: 1px solid #e2e2de;
align-items: center;
flex-wrap: wrap;
}

.deposit-add-row input[type=“text”] {
flex: 1;
min-width: 80px;
background: #f4f4f2;
border: 1px solid #e2e2de;
border-radius: 6px;
font-family: ‘Space Mono’, monospace;
font-size: 12px;
color: #1a1a1a;
padding: 7px 10px;
outline: none;
}

.deposit-add-row input[type=“number”] {
width: 100px;
background: #f4f4f2;
border: 1px solid #e2e2de;
border-radius: 6px;
font-family: ‘Space Mono’, monospace;
font-size: 12px;
color: #1a1a1a;
padding: 7px 10px;
outline: none;
-webkit-appearance: none;
text-align: right;
}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

.deposit-add-row input:focus { border-color: #1a1a1a; }

.btn-add-deposit {
background: #1a1a1a;
border: none;
border-radius: 6px;
font-family: ‘Space Mono’, monospace;
font-size: 11px;
font-weight: 700;
color: #ffffff;
padding: 7px 14px;
cursor: pointer;
white-space: nowrap;
}

/* ── SPENDING ── */
.spending-grid {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 1px;
background: #e2e2de;
}

.spending-cell {
background: #ffffff;
padding: 14px 16px;
}

.spending-label {
font-size: 8px;
font-weight: 700;
letter-spacing: 0.15em;
text-transform: uppercase;
color: #8a8a86;
margin-bottom: 6px;
}

.spending-input {
width: 100%;
background: #f4f4f2;
border: 1px solid #e2e2de;
border-radius: 5px;
font-family: ‘Space Mono’, monospace;
font-size: 14px;
font-weight: 700;
color: #1a1a1a;
padding: 6px 8px;
outline: none;
-webkit-appearance: none;
text-align: right;
}

.spending-input:focus { border-color: #1a1a1a; }

.spending-sub {
font-size: 9px;
color: #8a8a86;
margin-top: 4px;
}

/* ── BILLS ── */
.bills-list { padding: 0 18px; }

.bill-item {
display: grid;
grid-template-columns: auto 1fr auto auto auto;
grid-template-rows: auto 2px;
gap: 8px;
align-items: center;
padding: 10px 0;
border-bottom: 1px solid #f0f0ee;
transition: opacity 0.2s;
}

.bill-item:last-child { border-bottom: none; }
.bill-item.paid { opacity: 0.35; }

.paid-btn {
width: 20px;
height: 20px;
border-radius: 50%;
border: 2px solid #e2e2de;
background: transparent;
cursor: pointer;
flex-shrink: 0;
display: flex;
align-items: center;
justify-content: center;
font-size: 11px;
color: transparent;
padding: 0;
transition: all 0.15s;
}

.paid-btn.checked {
background: #267a2a;
border-color: #267a2a;
color: #ffffff;
}

.bill-name {
background: transparent;
border: none;
font-family: ‘Space Mono’, monospace;
font-size: 11px;
font-weight: 700;
color: #1a1a1a;
outline: none;
width: 100%;
text-transform: uppercase;
letter-spacing: 0.05em;
}

.bill-name::placeholder { color: #c8c8c2; font-weight: 400; }

.bill-amt-wrap {
display: flex;
align-items: center;
gap: 2px;
background: #f4f4f2;
border: 1px solid #e2e2de;
border-radius: 5px;
padding: 4px 8px;
}

.bill-amt-wrap .sym { font-size: 10px; color: #8a8a86; }

.bill-amt {
background: transparent;
border: none;
font-family: ‘Space Mono’, monospace;
font-size: 12px;
color: #1a1a1a;
outline: none;
width: 68px;
text-align: right;
-webkit-appearance: none;
}

.tag-btn {
font-family: ‘Space Mono’, monospace;
font-size: 7px;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
border-radius: 20px;
padding: 3px 7px;
border: 1px solid #e2e2de;
cursor: pointer;
white-space: nowrap;
background: #f4f4f2;
color: #8a8a86;
}

.tag-btn.need { background: #e8f0fb; border-color: #a8c0ee; color: #2450a0; }
.tag-btn.want { background: #fef3e2; border-color: #f0c878; color: #8a5000; }

.btn-del {
background: none;
border: none;
font-size: 15px;
color: #c8c8c2;
cursor: pointer;
padding: 0 2px;
line-height: 1;
}

.btn-del:hover { color: #c93b2e; }

.bill-bar { grid-column: 1 / -1; height: 2px; background: #f0f0ee; border-radius: 1px; }
.bill-bar-fill { height: 100%; border-radius: 1px; transition: width 0.3s ease; background: #c8c8c2; }
.bill-bar-fill.need { background: #5b8ee8; }
.bill-bar-fill.want { background: #c87c1a; }
.bill-bar-fill.paid-bar { background: #267a2a; }

.section-label {
font-size: 8px;
font-weight: 700;
letter-spacing: 0.18em;
text-transform: uppercase;
color: #c8c8c2;
padding: 10px 0 2px;
}

.bills-tally {
border-top: 1px solid #e2e2de;
padding: 12px 18px;
display: flex;
flex-direction: column;
gap: 7px;
}

.tally-row {
display: flex;
justify-content: space-between;
align-items: center;
}

.tally-row-label {
font-size: 9px;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
color: #8a8a86;
display: flex;
align-items: center;
gap: 6px;
}

.tally-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.tally-val { font-size: 13px; font-weight: 700; }
.tally-val.green { color: #267a2a; }
.tally-val.red   { color: #c93b2e; }
.tally-val.dark  { color: #1a1a1a; font-size: 15px; }
.tally-divider-line { height: 1px; background: #e2e2de; margin: 2px 0; }

.bills-footer {
padding: 10px 18px;
border-top: 1px solid #e2e2de;
}

.btn-add {
width: 100%;
background: transparent;
border: 1px dashed #c8c8c2;
border-radius: 6px;
font-family: ‘Space Mono’, monospace;
font-size: 10px;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
color: #8a8a86;
padding: 8px;
cursor: pointer;
}

.btn-add:hover { border-color: #1a1a1a; color: #1a1a1a; }

/* ── PROGRESS BAR ── */
.progress-wrap {
padding: 16px 18px;
border-top: 1px solid #e2e2de;
}

.progress-label {
display: flex;
justify-content: space-between;
margin-bottom: 8px;
font-size: 9px;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
color: #8a8a86;
}

.progress-bar {
height: 8px;
background: #f0f0ee;
border-radius: 4px;
overflow: hidden;
}

.progress-fill {
height: 100%;
border-radius: 4px;
transition: width 0.5s ease;
background: #267a2a;
}

.progress-fill.warning { background: #c87c1a; }
.progress-fill.danger  { background: #c93b2e; }

@media (max-width: 480px) {
.site-header { padding: 12px 14px; }
.balance-amount { font-size: 38px; }
.balance-grid { grid-template-columns: 1fr 1fr 1fr; }
.balance-cell { padding: 10px 10px; }
.balance-cell-val { font-size: 12px; }
.spending-grid { grid-template-columns: 1fr 1fr 1fr; }
.deposit-add-row { gap: 6px; }
.deposit-add-row input[type=“text”] { min-width: 60px; }
.deposit-add-row input[type=“number”] { width: 85px; }
}

@media print {
@page { margin: 15mm; size: A4; }
body { background: #fff !important; padding-bottom: 0; }
.btn-reset, .btn-pdf, .btn-add, .btn-del, .paid-btn, .deposit-add-row, .bills-footer { display: none !important; }
.balance-hero { background: #1a1a1a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

</head>

<script>
var deposits = [];

var bills = [
  { name: 'MORTGAGE',        amt: 2104.84, tag: 'need', paid: false },
  { name: 'LIBERTY MUTUAL',  amt: 457.21,  tag: 'need', paid: false },
  { name: 'CSU UTILITIES',   amt: 259.00,  tag: 'need', paid: false },
  { name: 'RAV4 PAYMENT',    amt: 303.08,  tag: 'need', paid: false },
  { name: 'T-MOBILE',        amt: 175.25,  tag: 'need', paid: false },
  { name: 'METRONET',        amt: 72.90,   tag: 'need', paid: false },
  { name: 'KATIE GAS',       amt: 100.00,  tag: 'need', paid: false },
  { name: 'QUICK QUACK',     amt: 61.99,   tag: 'want', paid: false },
  { name: 'YOUTUBE PREMIUM', amt: 25.08,   tag: 'want', paid: false },
  { name: 'HBO/HULU/DISNEY', amt: 34.69,   tag: 'want', paid: false }
];

function fmt(n) {
  var neg = n < 0;
  return (neg ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getDeposited() {
  return deposits.reduce(function(s, d) { return s + d.amt; }, 0);
}

function getBillTotals() {
  var paid = 0, unpaid = 0;
  bills.forEach(function(b) {
    if (b.paid) paid += b.amt;
    else unpaid += b.amt;
  });
  return { paid: paid, unpaid: unpaid, total: paid + unpaid };
}

function getWeeklySpend() {
  return (parseFloat(document.getElementById('sp-cody').value)  || 0)
       + (parseFloat(document.getElementById('sp-katie').value) || 0)
       + (parseFloat(document.getElementById('sp-kid').value)   || 0);
}

function currentMonth() {
  var d = new Date();
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function addDeposit() {
  var label  = document.getElementById('dep-label').value.trim() || 'DEPOSIT';
  var amount = parseFloat(document.getElementById('dep-amount').value) || 0;
  if (amount <= 0) return;
  var now = new Date();
  var dateStr = (now.getMonth()+1) + '/' + now.getDate();
  deposits.push({ label: label.toUpperCase(), amt: amount, date: dateStr });
  document.getElementById('dep-amount').value = '';
  document.getElementById('dep-label').value = 'PAYROLL';
  renderDeposits();
  recalc();
}

function removeDeposit(i) {
  deposits.splice(i, 1);
  renderDeposits();
  recalc();
}

function renderDeposits() {
  var container = document.getElementById('deposit-list');
  if (deposits.length === 0) {
    container.innerHTML = '<div style="padding:16px 0;font-size:11px;color:#8a8a86;text-align:center">No deposits yet &#8212; add your first paycheck below</div>';
    return;
  }
  container.innerHTML = '';
  deposits.forEach(function(d, i) {
    var div = document.createElement('div');
    div.className = 'deposit-item';
    div.innerHTML =
      '<div class="deposit-label">' + d.label + '</div>' +
      '<div class="deposit-date">' + d.date + '</div>' +
      '<div class="deposit-amount">+' + fmt(d.amt) + '</div>' +
      '<button class="deposit-del" onclick="removeDeposit(' + i + ')">x</button>';
    container.appendChild(div);
  });
}

function togglePaid(i) {
  bills[i].paid = !bills[i].paid;
  renderBills();
  recalc();
}

function cycleTag(i) {
  var t = bills[i].tag;
  bills[i].tag = t === 'none' ? 'need' : t === 'need' ? 'want' : 'none';
  renderBills();
  recalc();
}

function getSortedBills() {
  var needs = [], wants = [], none = [];
  bills.forEach(function(b, i) {
    var obj = { bill: b, idx: i };
    if (b.tag === 'want') wants.push(obj);
    else if (b.tag === 'need') needs.push(obj);
    else none.push(obj);
  });
  function sortGroup(arr) {
    return arr.sort(function(a, b) { return (a.bill.paid ? 1 : 0) - (b.bill.paid ? 1 : 0); });
  }
  return sortGroup(needs).concat(sortGroup(none)).concat(sortGroup(wants));
}

function renderBills() {
  var bt = getBillTotals();
  var container = document.getElementById('bills-list');
  var tally = document.getElementById('bills-tally');
  container.innerHTML = '';

  var sorted = getSortedBills();
  var wantStarted = false;

  sorted.forEach(function(obj) {
    var bill = obj.bill;
    var i    = obj.idx;

    if (bill.tag === 'want' && !wantStarted) {
      wantStarted = true;
      var lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'Wants';
      container.appendChild(lbl);
    }

    var pct      = bt.total > 0 ? (bill.amt / bt.total) * 100 : 0;
    var tag      = bill.tag || 'none';
    var tagLabel = tag === 'need' ? 'Need' : tag === 'want' ? 'Want' : '-';
    var barClass = bill.paid ? 'paid-bar' : (tag !== 'none' ? tag : '');

    var div = document.createElement('div');
    div.className = 'bill-item' + (bill.paid ? ' paid' : '');
    div.innerHTML =
      '<button class="paid-btn ' + (bill.paid ? 'checked' : '') + '" onclick="togglePaid(' + i + ')">' + (bill.paid ? '&#10003;' : '') + '</button>' +
      '<input class="bill-name" type="text" value="' + bill.name + '" placeholder="BILL NAME" onchange="bills[' + i + '].name = this.value">' +
      '<div class="bill-amt-wrap"><span class="sym">$</span><input class="bill-amt" type="number" value="' + bill.amt + '" oninput="bills[' + i + '].amt = parseFloat(this.value)||0; recalc()"></div>' +
      '<button class="tag-btn ' + (tag !== 'none' ? tag : '') + '" onclick="cycleTag(' + i + ')">' + tagLabel + '</button>' +
      '<button class="btn-del" onclick="removeBill(' + i + ')">x</button>' +
      '<div class="bill-bar"><div class="bill-bar-fill ' + barClass + '" style="width:' + Math.min(100, pct * 1.5) + '%"></div></div>';
    container.appendChild(div);
  });

  // Progress bar
  var paidCount = bills.filter(function(b) { return b.paid; }).length;
  var paidPct   = bills.length > 0 ? (bt.paid / bt.total) * 100 : 0;
  document.getElementById('bills-progress-label').textContent = paidCount + ' of ' + bills.length + ' paid';
  document.getElementById('progress-pct').textContent = paidPct.toFixed(0) + '%';
  var fill = document.getElementById('progress-fill');
  fill.style.width = paidPct + '%';
  fill.className = 'progress-fill' + (paidPct >= 100 ? '' : paidPct >= 60 ? ' warning' : '');
  if (paidPct >= 100) fill.className = 'progress-fill';

  // Tally
  tally.innerHTML =
    '<div class="tally-row">' +
      '<div class="tally-row-label"><div class="tally-dot" style="background:#267a2a"></div>Paid</div>' +
      '<div class="tally-val green">' + fmt(bt.paid) + '</div>' +
    '</div>' +
    '<div class="tally-row">' +
      '<div class="tally-row-label"><div class="tally-dot" style="background:#c93b2e"></div>Remaining</div>' +
      '<div class="tally-val red">' + fmt(bt.unpaid) + '</div>' +
    '</div>' +
    '<div class="tally-divider-line"></div>' +
    '<div class="tally-row">' +
      '<div class="tally-row-label">Total Bills</div>' +
      '<div class="tally-val dark">' + fmt(bt.total) + '</div>' +
    '</div>';
}

function addBill() {
  bills.push({ name: '', amt: 0, tag: 'none', paid: false });
  renderBills();
  recalc();
  setTimeout(function() {
    var inputs = document.querySelectorAll('.bill-name');
    inputs[inputs.length - 1].focus();
  }, 0);
}

function removeBill(i) {
  bills.splice(i, 1);
  renderBills();
  recalc();
}

function resetAll() {
  if (!confirm('Start a new month? This will clear all deposits and mark all bills unpaid.')) return;
  deposits = [];
  bills.forEach(function(b) { b.paid = false; });
  renderDeposits();
  renderBills();
  recalc();
}

function recalc() {
  var deposited   = getDeposited();
  var bt          = getBillTotals();
  var weeklySpend = getWeeklySpend();
  var balance     = deposited - bt.unpaid - weeklySpend;

  // Hero
  document.getElementById('hero-period').textContent = currentMonth();
  var heroEl = document.getElementById('hero-balance');
  heroEl.textContent = fmt(balance);
  heroEl.className = 'balance-amount ' + (balance >= 0 ? 'positive' : 'negative');
  document.getElementById('hero-sub').textContent = balance >= 0
    ? 'available after bills and spending'
    : 'short — more deposits needed';
  document.getElementById('hero-deposited').textContent  = fmt(deposited);
  document.getElementById('hero-bills-left').textContent = fmt(bt.unpaid);
  document.getElementById('hero-spending').textContent   = fmt(weeklySpend);

  // Deposit total
  document.getElementById('deposit-total').textContent = fmt(deposited);

  // Spending label
  document.getElementById('spend-total-label').textContent = fmt(weeklySpend) + ' / week';

  renderBills();
}

// Init
renderDeposits();
renderBills();
recalc();
</script>

</body>
</html>
