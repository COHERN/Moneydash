<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #f4f4f2;
–white: #ffffff;
–border: #e2e2de;
–border-strong: #c8c8c2;
–text: #1a1a1a;
–muted: #8a8a86;
–muted-light: #b8b8b4;
–red: #c93b2e;
–green: #267a2a;
–mono: ‘Space Mono’, monospace;
–radius: 10px;
–radius-sm: 6px;
}

body {
background: var(–bg);
color: var(–text);
font-family: var(–mono);
min-height: 100vh;
padding-bottom: 80px;
}

.site-header {
background: var(–white);
border-bottom: 1px solid var(–border);
padding: 16px 24px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}

.site-title {
font-size: 13px;
font-weight: 700;
letter-spacing: 0.2em;
text-transform: uppercase;
flex-shrink: 0;
}

.header-right {
display: flex;
align-items: center;
gap: 10px;
}

.date-input {
font-family: var(–mono);
font-size: 10px;
font-weight: 700;
letter-spacing: 0.12em;
color: var(–muted);
background: var(–bg);
border: 1px solid var(–border);
border-radius: 20px;
padding: 4px 12px;
outline: none;
cursor: pointer;
transition: border-color 0.15s, color 0.15s;
-webkit-appearance: none;
text-transform: uppercase;
width: 148px;
}

.date-input:focus { border-color: var(–border-strong); color: var(–text); }
.date-input::-webkit-calendar-picker-indicator { opacity: 0.4; cursor: pointer; margin-left: 2px; }

.btn-pdf {
font-family: var(–mono);
font-size: 10px;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(–white);
background: var(–text);
border: none;
border-radius: 20px;
padding: 5px 14px;
cursor: pointer;
transition: opacity 0.15s;
flex-shrink: 0;
}

.btn-pdf:hover { opacity: 0.75; }

.main {
max-width: 580px;
margin: 0 auto;
padding: 28px 16px;
display: flex;
flex-direction: column;
gap: 14px;
}

.card {
background: var(–white);
border: 1px solid var(–border);
border-radius: var(–radius);
overflow: hidden;
}

.card-header {
padding: 14px 20px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
}

.card-title {
font-size: 9px;
font-weight: 700;
letter-spacing: 0.2em;
text-transform: uppercase;
color: var(–muted);
}

.card-body { padding: 18px 20px; }

.period-toggle {
display: flex;
background: var(–bg);
border: 1px solid var(–border);
border-radius: var(–radius-sm);
padding: 3px;
gap: 2px;
}

.toggle-btn {
background: transparent;
border: 1px solid transparent;
font-family: var(–mono);
font-size: 9px;
font-weight: 700;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
padding: 5px 10px;
border-radius: 4px;
cursor: pointer;
transition: all 0.15s;
}

.toggle-btn.active {
background: var(–white);
color: var(–text);
border-color: var(–border);
}

.stat-row {
display: grid;
grid-template-columns: 1fr 1px 1fr 1px 1fr;
border-bottom: 1px solid var(–border);
}

@media (max-width: 480px) {
.stat-row {
grid-template-columns: 1fr 1fr;
}
.stat-divider { display: none; }
.stat-cell { padding: 14px 16px 12px; border-bottom: 1px solid var(–border); }
.stat-cell:nth-child(1) { border-right: 1px solid var(–border); }
.stat-cell:nth-child(3) { border-right: 1px solid var(–border); }
.stat-cell:nth-child(5) { grid-column: 1 / -1; border-bottom: none; }
.stat-val { font-size: 20px; }
.site-header { padding: 12px 16px; }
.date-input { width: 120px; font-size: 9px; }
.btn-pdf { font-size: 9px; padding: 5px 10px; }
.field-row { grid-template-columns: 1fr 1fr; gap: 8px; }
.card-body { padding: 14px 16px; }
.bills-list { padding: 0 14px; }
.bills-footer { padding: 10px 14px; }
.bills-tally { padding: 10px 14px; }
.bar-section { padding: 14px 16px; }
}

.stat-divider { background: var(–border); }
.stat-cell { padding: 20px 18px 16px; }

.stat-label {
font-size: 9px;
font-weight: 700;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 7px;
}

.stat-val {
font-size: 20px;
font-weight: 700;
letter-spacing: -0.02em;
line-height: 1;
}

.stat-val.pos { color: var(–green); }
.stat-val.neg { color: var(–red); }

.stat-sub {
font-size: 10px;
color: var(–muted);
margin-top: 4px;
line-height: 1.4;
}

.bar-section { padding: 18px 20px; }

.income-bar {
height: 10px;
border-radius: 5px;
overflow: hidden;
display: flex;
background: var(–border);
margin-bottom: 14px;
}

.ib-bills { background: var(–red);   transition: width 0.5s ease; }
.ib-allow { background: #c87c1a;      transition: width 0.5s ease; }
.ib-left  { background: var(–green); transition: width 0.5s ease; }

.bar-legend { display: flex; flex-direction: column; gap: 8px; }
.bar-leg-row { display: flex; align-items: center; gap: 10px; }
.bl-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.bl-name { flex: 1; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(–muted); }
.bl-amt  { font-size: 12px; font-weight: 700; }
.bl-pct  { font-size: 11px; color: var(–muted); min-width: 38px; text-align: right; }

.field-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 12px;
}

.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }

.field label {
display: block;
font-size: 9px;
font-weight: 700;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 5px;
}

.field input[type=“number”] {
width: 100%;
background: var(–bg);
border: 1px solid var(–border);
border-radius: var(–radius-sm);
color: var(–text);
font-family: var(–mono);
font-size: 14px;
padding: 9px 12px;
outline: none;
transition: border-color 0.15s;
-webkit-appearance: none;
}

.field input[type=“number”]:focus { border-color: var(–text); }

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

.computed {
font-size: 11px;
color: var(–muted);
padding: 8px 12px;
background: var(–bg);
border: 1px solid var(–border);
border-radius: var(–radius-sm);
margin-top: -4px;
line-height: 1.5;
}

.computed strong { color: var(–text); font-weight: 700; }
.computed .dot { margin: 0 8px; color: var(–border-strong); }

.bills-list { padding: 0 20px; }

.bill-item {
display: grid;
grid-template-columns: 1fr auto auto auto auto;
grid-template-rows: auto 3px;
gap: 8px;
align-items: center;
padding: 11px 0;
border-bottom: 1px solid var(–border);
}

.bill-item:last-child { border-bottom: none; }

.bill-name {
background: transparent;
border: none;
font-family: var(–mono);
font-size: 12px;
font-weight: 700;
color: var(–text);
outline: none;
width: 100%;
text-transform: uppercase;
letter-spacing: 0.06em;
padding: 2px 0;
}

.bill-name::placeholder { color: var(–muted-light); font-weight: 400; }

.bill-amt-wrap {
display: flex;
align-items: center;
gap: 2px;
background: var(–bg);
border: 1px solid var(–border);
border-radius: var(–radius-sm);
padding: 5px 9px;
}

.bill-amt-wrap .sym { font-size: 11px; color: var(–muted); }

.bill-amt {
background: transparent;
border: none;
font-family: var(–mono);
font-size: 13px;
color: var(–text);
outline: none;
width: 70px;
text-align: right;
-webkit-appearance: none;
}

.bill-pct {
font-size: 10px;
font-weight: 700;
min-width: 40px;
text-align: right;
color: var(–muted);
letter-spacing: 0.05em;
}

.tag-btn {
font-family: var(–mono);
font-size: 8px;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
border-radius: 20px;
padding: 3px 8px;
border: 1px solid var(–border);
cursor: pointer;
transition: all 0.15s;
white-space: nowrap;
background: var(–bg);
color: var(–muted);
}

.tag-btn.need { background: #e8f0fb; border-color: #a8c0ee; color: #2450a0; }
.tag-btn.want { background: #fef3e2; border-color: #f0c878; color: #8a5000; }

/* BUNDLED tally — single cell */
.bills-tally {
border-top: 1px solid var(–border);
border-bottom: 1px solid var(–border);
padding: 10px 20px;
display: flex;
align-items: center;
justify-content: space-between;
}

.tally-label {
font-size: 8px;
font-weight: 700;
letter-spacing: 0.16em;
text-transform: uppercase;
color: var(–muted);
}

.tally-amounts {
display: flex;
gap: 16px;
align-items: center;
}

.tally-chunk { text-align: right; }
.tally-chunk-label { font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: var(–muted); }
.tally-chunk-val { font-size: 13px; font-weight: 700; }
.tally-chunk-val.need { color: #2450a0; }
.tally-chunk-val.want { color: #8a5000; }
.tally-total { font-size: 15px; font-weight: 700; color: var(–text); }
.tally-divider { width: 1px; height: 28px; background: var(–border); }

.bill-bar { grid-column: 1 / -1; height: 3px; background: var(–border); border-radius: 1px; }

.bill-bar-fill {
height: 100%;
background: var(–muted-light);
border-radius: 1px;
transition: width 0.4s ease, background 0.2s ease;
}

.bill-bar-fill.need { background: #5b8ee8; }
.bill-bar-fill.want { background: #c87c1a; }

.btn-del {
background: none;
border: none;
font-family: var(–mono);
font-size: 16px;
color: var(–muted-light);
cursor: pointer;
padding: 2px 4px;
transition: color 0.15s;
line-height: 1;
border-radius: 4px;
}

.btn-del:hover { color: var(–red); }

.bills-footer { padding: 12px 20px; border-top: 1px solid var(–border); }

.btn-add {
width: 100%;
background: transparent;
border: 1px dashed var(–border-strong);
border-radius: var(–radius-sm);
font-family: var(–mono);
font-size: 10px;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(–muted);
padding: 9px 10px;
cursor: pointer;
transition: all 0.15s;
}

.btn-add:hover { border-color: var(–text); color: var(–text); }

@media print {
@page { margin: 18mm 16mm; size: A4; }
body { background: #fff !important; padding-bottom: 0; }
.site-header { background: #fff !important; border-bottom: 1px solid #ccc !important; padding: 12px 0 10px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.btn-pdf, .date-input::-webkit-calendar-picker-indicator, .period-toggle, .btn-add, .btn-del { display: none !important; }
.date-input { border: none !important; background: transparent !important; padding: 0 !important; }
.main { padding: 16px 0; gap: 10px; }
.card { break-inside: avoid; border: 1px solid #ccc !important; border-radius: 6px !important; }
.stat-val.pos { color: #267a2a !important; }
.stat-val.neg { color: #c93b2e !important; }
}
</style>

<script>
const defaultBills = [
  { name: 'MORTGAGE',        amt: 2104.84, tag: 'need' },
  { name: 'LIBERTY MUTUAL',  amt: 457.21,  tag: 'need' },
  { name: 'CSU UTILITIES',   amt: 259.00,  tag: 'need' },
  { name: 'RAV4 PAYMENT',    amt: 303.08,  tag: 'need' },
  { name: 'T-MOBILE',        amt: 175.25,  tag: 'need' },
  { name: 'METRONET',        amt: 72.90,   tag: 'need' },
  { name: 'QUICK QUACK',     amt: 61.99,   tag: 'want' },
  { name: 'YOUTUBE PREMIUM', amt: 25.08,   tag: 'want' },
  { name: 'HBO/HULU/DISNEY', amt: 34.69,   tag: 'want' },
  { name: 'KATIE GAS',       amt: 100.00,  tag: 'need' },
];

let bills  = defaultBills.map(b => ({ ...b }));
let period = 'weekly';

function todayValue() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function updateDateBadge() {
  const val = document.getElementById('budget-date').value;
  const lbl = document.getElementById('date-label');
  if (!val) { lbl.textContent = '—'; return; }
  const [y, m, d] = val.split('-').map(Number);
  lbl.textContent = new Date(y, m-1, d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function setPeriod(p) {
  period = p;
  document.getElementById('btn-weekly').classList.toggle('active',  p === 'weekly');
  document.getElementById('btn-monthly').classList.toggle('active', p === 'monthly');
  recalc();
}

function fmt(n) {
  const neg = n < 0;
  return (neg ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getMonthly() {
  return (parseFloat(document.getElementById('weekly').value) || 0) * 4.33
       + (parseFloat(document.getElementById('other').value)  || 0);
}

function getAllow() {
  return ((parseFloat(document.getElementById('allow-cody').value)  || 0)
        + (parseFloat(document.getElementById('allow-katie').value) || 0)
        + (parseFloat(document.getElementById('allow-kid').value)   || 0)) * 4.33;
}

function getBills() {
  return bills.reduce((s, b) => s + (parseFloat(b.amt) || 0), 0);
}

function cycleTag(i) {
  const t = bills[i].tag;
  bills[i].tag = t === 'none' ? 'need' : t === 'need' ? 'want' : 'none';
  renderBills();
}

function renderBills() {
  const monthly   = getMonthly();
  const container = document.getElementById('bills-list');
  container.innerHTML = '';
  let needTotal = 0, wantTotal = 0;

  bills.forEach((bill, i) => {
    const pct      = monthly > 0 ? (bill.amt / monthly) * 100 : 0;
    const tag      = bill.tag || 'none';
    const barClass = tag !== 'none' ? tag : '';
    const tagLabel = tag === 'need' ? 'Need' : tag === 'want' ? 'Want' : '—';

    if (tag === 'need') needTotal += bill.amt;
    else if (tag === 'want') wantTotal += bill.amt;

    const div = document.createElement('div');
    div.className = 'bill-item';
    div.innerHTML = `
      <input class="bill-name" type="text" value="${bill.name}" placeholder="BILL NAME"
        onchange="bills[${i}].name = this.value">
      <div class="bill-amt-wrap">
        <span class="sym">$</span>
        <input class="bill-amt" type="number" value="${bill.amt}"
          oninput="bills[${i}].amt = parseFloat(this.value) || 0; recalc()">
      </div>
      <span class="bill-pct">${pct.toFixed(1)}%</span>
      <button class="tag-btn ${tag !== 'none' ? tag : ''}" onclick="cycleTag(${i})">${tagLabel}</button>
      <button class="btn-del" onclick="removeBill(${i})" title="Remove">×</button>
      <div class="bill-bar">
        <div class="bill-bar-fill ${barClass}" style="width:${Math.min(100, pct * 4)}%"></div>
      </div>
    `;
    container.appendChild(div);
  });

  document.getElementById('tally-needs').textContent = fmt(needTotal);
  document.getElementById('tally-wants').textContent = fmt(wantTotal);
  document.getElementById('tally-total').textContent = fmt(needTotal + wantTotal);
}

function addBill() {
  bills.push({ name: '', amt: 0, tag: 'none' });
  renderBills();
  recalc();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.bill-name');
    inputs[inputs.length - 1].focus();
  }, 0);
}

function removeBill(i) {
  bills.splice(i, 1);
  renderBills();
  recalc();
}

function recalc() {
  const monthly    = getMonthly();
  const allow      = getAllow();
  const totalBills = getBills();
  const leftover   = monthly - totalBills - allow;
  const weekly     = parseFloat(document.getElementById('weekly').value) || 0;

  const pBills = monthly > 0 ? (totalBills / monthly) * 100 : 0;
  const pAllow = monthly > 0 ? (allow      / monthly) * 100 : 0;
  const pLeft  = monthly > 0 ? Math.max(0, (leftover / monthly) * 100) : 0;

  const div = period === 'weekly' ? 4.33 : 1;

  document.getElementById('ov-income').textContent     = fmt(monthly / div);
  document.getElementById('ov-income-sub').textContent = period === 'weekly'
    ? fmt(monthly) + ' /mo'
    : fmt(weekly)  + ' /wk';

  document.getElementById('ov-out').textContent        = fmt((totalBills + allow) / div);
  document.getElementById('ov-out-pct').textContent    = (pBills + pAllow).toFixed(1) + '% of income';

  const leftEl = document.getElementById('ov-left');
  leftEl.textContent = fmt(leftover / div);
  leftEl.className   = 'stat-val ' + (leftover >= 0 ? 'pos' : 'neg');
  document.getElementById('ov-left-pct').textContent   = pLeft.toFixed(1) + '% of income'
    + (leftover < 0 ? ' — over!' : '');

  document.getElementById('bar-bills').style.width = Math.min(100, pBills) + '%';
  document.getElementById('bar-allow').style.width = Math.min(100 - Math.min(100, pBills), pAllow) + '%';
  document.getElementById('bar-left').style.width  = Math.min(
    100 - Math.min(100, pBills) - Math.min(100 - Math.min(100, pBills), pAllow), pLeft
  ) + '%';

  document.getElementById('leg-bills').textContent    = fmt(totalBills / div);
  document.getElementById('legpct-bills').textContent = pBills.toFixed(1) + '%';
  document.getElementById('leg-allow').textContent    = fmt(allow / div);
  document.getElementById('legpct-allow').textContent = pAllow.toFixed(1) + '%';
  document.getElementById('leg-left').textContent     = fmt(Math.max(0, leftover) / div);
  document.getElementById('legpct-left').textContent  = pLeft.toFixed(1) + '%';

  document.getElementById('payroll-monthly').textContent = fmt(weekly * 4.33);
  document.getElementById('payroll-annual').textContent  = fmt(monthly * 12);

  document.getElementById('allow-total-monthly').textContent = fmt(allow);
  document.getElementById('allow-pct').textContent           = pAllow.toFixed(1) + '%';

  renderBills();
}

document.getElementById('budget-date').value = todayValue();
updateDateBadge();
renderBills();
recalc();
</script>

</body>
</html>
