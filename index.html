<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4f4f2;
  --white: #ffffff;
  --border: #e2e2de;
  --border-strong: #c8c8c2;
  --text: #1a1a1a;
  --muted: #8a8a86;
  --muted-light: #b8b8b4;
  --red: #c93b2e;
  --green: #267a2a;
  --mono: 'Space Mono', monospace;
  --radius: 10px;
  --radius-sm: 6px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ── Header ── */
.site-header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.site-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  flex-shrink: 0;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* date input in header */
.date-input {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  outline: none;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  -webkit-appearance: none;
  text-transform: uppercase;
  width: 148px;
}

.date-input:focus { border-color: var(--border-strong); color: var(--text); }
/* style the calendar picker arrow away on webkit */
.date-input::-webkit-calendar-picker-indicator {
  opacity: 0.4;
  cursor: pointer;
  margin-left: 2px;
}

/* PDF export button */
.btn-pdf {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--white);
  background: var(--text);
  border: none;
  border-radius: 20px;
  padding: 5px 14px;
  cursor: pointer;
  transition: opacity 0.15s;
  flex-shrink: 0;
}

.btn-pdf:hover { opacity: 0.75; }

/* ── Layout ── */
.main {
  max-width: 580px;
  margin: 0 auto;
  padding: 28px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ── Cards ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}

.card-body { padding: 18px 20px; }

/* ── Period toggle ── */
.period-toggle {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 2px;
}

.toggle-btn {
  background: transparent;
  border: 1px solid transparent;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}

.toggle-btn.active {
  background: var(--white);
  color: var(--text);
  border-color: var(--border);
}

/* ── Overview stats ── */
.stat-row {
  display: grid;
  grid-template-columns: 1fr 1px 1fr 1px 1fr;
  border-bottom: 1px solid var(--border);
}

.stat-divider { background: var(--border); }
.stat-cell { padding: 20px 18px 16px; }

.stat-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}

.stat-val {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}

.stat-val.pos { color: var(--green); }
.stat-val.neg { color: var(--red); }

.stat-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.4;
}

/* ── Bar section ── */
.bar-section { padding: 18px 20px; }

.income-bar {
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  display: flex;
  background: var(--border);
  margin-bottom: 14px;
}

.ib-bills { background: var(--red);   transition: width 0.5s ease; }
.ib-allow { background: #c87c1a;      transition: width 0.5s ease; }
.ib-left  { background: var(--green); transition: width 0.5s ease; }

.bar-legend { display: flex; flex-direction: column; gap: 8px; }

.bar-leg-row { display: flex; align-items: center; gap: 10px; }

.bl-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.bl-name { flex: 1; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.bl-amt  { font-size: 12px; font-weight: 700; }
.bl-pct  { font-size: 11px; color: var(--muted); min-width: 38px; text-align: right; }

/* ── Fields ── */
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }

.field label {
  display: block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}

.field input[type="number"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}

.field input[type="number"]:focus { border-color: var(--text); }

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

.computed {
  font-size: 11px;
  color: var(--muted);
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-top: -4px;
  line-height: 1.5;
}

.computed strong { color: var(--text); font-weight: 700; }
.computed .dot { margin: 0 8px; color: var(--border-strong); }

/* ── Bills ── */
.bills-list { padding: 0 20px; }

.bill-item {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  grid-template-rows: auto 2px;
  gap: 8px;
  align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
}

.bill-item:last-child { border-bottom: none; }

.bill-name {
  background: transparent;
  border: none;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  outline: none;
  width: 100%;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 0;
}

.bill-name::placeholder { color: var(--muted-light); font-weight: 400; }

.bill-amt-wrap {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 9px;
}

.bill-amt-wrap .sym { font-size: 11px; color: var(--muted); }

.bill-amt {
  background: transparent;
  border: none;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  outline: none;
  width: 70px;
  text-align: right;
  -webkit-appearance: none;
}

.bill-pct {
  font-size: 10px;
  font-weight: 700;
  min-width: 40px;
  text-align: right;
  color: var(--muted);
  letter-spacing: 0.05em;
}

.bill-pct.high { color: var(--red); }

.bill-bar { grid-column: 1 / -1; height: 2px; background: var(--border); border-radius: 1px; }

.bill-bar-fill {
  height: 100%;
  background: var(--muted-light);
  border-radius: 1px;
  transition: width 0.4s ease;
}

.bill-bar-fill.high { background: var(--red); }

.btn-del {
  background: none;
  border: none;
  font-family: var(--mono);
  font-size: 16px;
  color: var(--muted-light);
  cursor: pointer;
  padding: 2px 4px;
  transition: color 0.15s;
  line-height: 1;
  border-radius: 4px;
}

.btn-del:hover { color: var(--red); }

.bills-footer { padding: 12px 20px; border-top: 1px solid var(--border); }

.btn-add {
  width: 100%;
  background: transparent;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 9px 10px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-add:hover { border-color: var(--text); color: var(--text); }

/* ── Print / PDF styles ── */
@media print {
  @page { margin: 18mm 16mm; size: A4; }

  body { background: #fff !important; padding-bottom: 0; }

  .site-header {
    background: #fff !important;
    border-bottom: 1px solid #ccc !important;
    padding: 12px 0 10px !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .btn-pdf,
  .date-input::-webkit-calendar-picker-indicator,
  .period-toggle,
  .btn-add,
  .btn-del { display: none !important; }

  .date-input {
    border: none !important;
    background: transparent !important;
    padding: 0 !important;
  }

  .main { padding: 16px 0; gap: 10px; }

  .card, .overview-card {
    break-inside: avoid;
    border: 1px solid #ccc !important;
    border-radius: 6px !important;
  }

  .income-bar .ib-bills,
  .income-bar .ib-allow,
  .income-bar .ib-left {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .stat-val.pos { color: #267a2a !important; }
  .stat-val.neg { color: #c93b2e !important; }
  .bill-pct.high { color: #c93b2e !important; }
  .bill-bar-fill.high { background: #c93b2e !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title">Budget OS</div>
  <div class="header-right">
    <input type="date" class="date-input" id="budget-date" oninput="updateDateBadge()">
    <button class="btn-pdf" onclick="window.print()">↓ Save PDF</button>
  </div>
</header>

<div class="main">

  <!-- OVERVIEW -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Overview — <span id="date-label">—</span></span>
      <div class="period-toggle">
        <button class="toggle-btn active" id="btn-weekly"  onclick="setPeriod('weekly')">Weekly</button>
        <button class="toggle-btn"        id="btn-monthly" onclick="setPeriod('monthly')">Monthly</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-cell">
        <div class="stat-label">Income</div>
        <div class="stat-val" id="ov-income">$0</div>
        <div class="stat-sub" id="ov-income-sub">—</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-cell">
        <div class="stat-label">Bills + Spending</div>
        <div class="stat-val" id="ov-out">$0</div>
        <div class="stat-sub" id="ov-out-pct">—</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-cell">
        <div class="stat-label">Left Over</div>
        <div class="stat-val" id="ov-left">$0</div>
        <div class="stat-sub" id="ov-left-pct">—</div>
      </div>
    </div>

    <div class="bar-section">
      <div class="income-bar">
        <div class="ib-bills" id="bar-bills" style="width:0%"></div>
        <div class="ib-allow" id="bar-allow" style="width:0%"></div>
        <div class="ib-left"  id="bar-left"  style="width:0%"></div>
      </div>
      <div class="bar-legend">
        <div class="bar-leg-row">
          <div class="bl-dot" style="background:var(--red)"></div>
          <span class="bl-name">Bills</span>
          <span class="bl-amt" id="leg-bills">$0</span>
          <span class="bl-pct" id="legpct-bills">0%</span>
        </div>
        <div class="bar-leg-row">
          <div class="bl-dot" style="background:#c87c1a"></div>
          <span class="bl-name">Spending</span>
          <span class="bl-amt" id="leg-allow">$0</span>
          <span class="bl-pct" id="legpct-allow">0%</span>
        </div>
        <div class="bar-leg-row">
          <div class="bl-dot" style="background:var(--green)"></div>
          <span class="bl-name">Left Over</span>
          <span class="bl-amt" id="leg-left">$0</span>
          <span class="bl-pct" id="legpct-left">0%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- INCOME -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Income</span>
    </div>
    <div class="card-body">
      <div class="field-row">
        <div class="field">
          <label>Weekly Paycheck</label>
          <input type="number" id="weekly" value="2097.44" oninput="recalc()">
        </div>
        <div class="field">
          <label>Other Monthly</label>
          <input type="number" id="other" value="0" placeholder="0.00" oninput="recalc()">
        </div>
      </div>
      <div class="computed">
        Monthly <strong id="payroll-monthly">$0</strong>
        <span class="dot">·</span>
        Annual <strong id="payroll-annual">$0</strong>
      </div>
    </div>
  </div>

  <!-- SPENDING (formerly Allowances) -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Spending — Weekly</span>
    </div>
    <div class="card-body">
      <div class="field-row">
        <div class="field">
          <label>Cody / Week</label>
          <input type="number" id="allow-cody" value="350" oninput="recalc()">
        </div>
        <div class="field">
          <label>Katie / Week</label>
          <input type="number" id="allow-katie" value="300" oninput="recalc()">
        </div>
      </div>
      <div class="field" style="max-width:48%">
        <label>Hailey / Week</label>
        <input type="number" id="allow-kid" value="50" oninput="recalc()">
      </div>
      <div class="computed" style="margin-top:12px">
        Monthly total <strong id="allow-total-monthly">$0</strong>
        <span class="dot">·</span>
        <strong id="allow-pct">0%</strong> of income
      </div>
    </div>
  </div>

  <!-- BILLS -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Monthly Bills</span>
    </div>
    <div class="bills-list" id="bills-list"></div>
    <div class="bills-footer">
      <button class="btn-add" onclick="addBill()">+ Add Bill</button>
    </div>
  </div>

</div>

<script>
const defaultBills = [
  { name: 'MORTGAGE',        amt: 2104.84 },
  { name: 'LIBERTY MUTUAL',  amt: 457.21  },
  { name: 'CSU UTILITIES',   amt: 259.00  },
  { name: 'RAV4 PAYMENT',    amt: 303.08  },
  { name: 'T-MOBILE',        amt: 175.25  },
  { name: 'METRONET',        amt: 72.90   },
  { name: 'QUICK QUACK',     amt: 61.99   },
  { name: 'YOUTUBE PREMIUM', amt: 25.08   },
  { name: 'HBO/HULU/DISNEY', amt: 34.69   },
  { name: 'KATIE GAS',       amt: 100.00  },
];

let bills  = defaultBills.map(b => ({ ...b }));
let period = 'weekly';

/* ── Date ── */
function todayValue() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function updateDateBadge() {
  const val = document.getElementById('budget-date').value;
  const lbl = document.getElementById('date-label');
  if (!val) { lbl.textContent = '—'; return; }
  const [y, m, d] = val.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  lbl.textContent = date.toLocaleDateString('en-US', {
    month: 'long', day: 'numeric', year: 'numeric'
  });
}

/* ── Period toggle ── */
function setPeriod(p) {
  period = p;
  document.getElementById('btn-weekly').classList.toggle('active',  p === 'weekly');
  document.getElementById('btn-monthly').classList.toggle('active', p === 'monthly');
  recalc();
}

/* ── Formatting ── */
function fmt(n) {
  const neg = n < 0;
  return (neg ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}

/* ── Computed values ── */
function getMonthly() {
  return (parseFloat(document.getElementById('weekly').value) || 0) * 4
       + (parseFloat(document.getElementById('other').value)  || 0);
}

function getAllow() {
  return ((parseFloat(document.getElementById('allow-cody').value)  || 0)
        + (parseFloat(document.getElementById('allow-katie').value) || 0)
        + (parseFloat(document.getElementById('allow-kid').value)   || 0)) * 4;
}

function getBills() {
  return bills.reduce((s, b) => s + (parseFloat(b.amt) || 0), 0);
}

/* ── Bill list ── */
function renderBills() {
  const monthly   = getMonthly();
  const container = document.getElementById('bills-list');
  container.innerHTML = '';
  bills.forEach((bill, i) => {
    const pct    = monthly > 0 ? (bill.amt / monthly) * 100 : 0;
    const isHigh = pct >= 15;
    const div    = document.createElement('div');
    div.className = 'bill-item';
    div.innerHTML = `
      <input class="bill-name" type="text" value="${bill.name}" placeholder="BILL NAME"
        onchange="bills[${i}].name = this.value">
      <div class="bill-amt-wrap">
        <span class="sym">$</span>
        <input class="bill-amt" type="number" value="${bill.amt}"
          oninput="bills[${i}].amt = parseFloat(this.value) || 0; recalc()">
      </div>
      <span class="bill-pct${isHigh ? ' high' : ''}">${pct.toFixed(1)}%</span>
      <button class="btn-del" onclick="removeBill(${i})" title="Remove">×</button>
      <div class="bill-bar">
        <div class="bill-bar-fill${isHigh ? ' high' : ''}" style="width:${Math.min(100, pct * 4)}%"></div>
      </div>
    `;
    container.appendChild(div);
  });
}

function addBill() {
  bills.push({ name: '', amt: 0 });
  renderBills();
  recalc();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.bill-name');
    inputs[inputs.length - 1].focus();
  }, 0);
}

function removeBill(i) {
  bills.splice(i, 1);
  renderBills();
  recalc();
}

/* ── Main recalc ── */
function recalc() {
  const monthly    = getMonthly();
  const allow      = getAllow();
  const totalBills = getBills();
  const leftover   = monthly - totalBills - allow;
  const weekly     = parseFloat(document.getElementById('weekly').value) || 0;

  const pBills = monthly > 0 ? (totalBills / monthly) * 100 : 0;
  const pAllow = monthly > 0 ? (allow      / monthly) * 100 : 0;
  const pLeft  = monthly > 0 ? Math.max(0, (leftover / monthly) * 100) : 0;

  const div = period === 'weekly' ? 4 : 1;

  /* overview stats */
  document.getElementById('ov-income').textContent     = fmt(monthly / div);
  document.getElementById('ov-income-sub').textContent = period === 'weekly'
    ? fmt(monthly) + ' /mo'
    : fmt(weekly) + ' /wk';

  document.getElementById('ov-out').textContent        = fmt((totalBills + allow) / div);
  document.getElementById('ov-out-pct').textContent    = (pBills + pAllow).toFixed(1) + '% of income';

  const leftEl = document.getElementById('ov-left');
  leftEl.textContent = fmt(leftover / div);
  leftEl.className   = 'stat-val ' + (leftover >= 0 ? 'pos' : 'neg');
  document.getElementById('ov-left-pct').textContent   = pLeft.toFixed(1) + '% of income'
    + (leftover < 0 ? ' — over!' : '');

  /* bar */
  document.getElementById('bar-bills').style.width = Math.min(100, pBills) + '%';
  document.getElementById('bar-allow').style.width = Math.min(100 - Math.min(100, pBills), pAllow) + '%';
  document.getElementById('bar-left').style.width  = Math.min(
    100 - Math.min(100, pBills) - Math.min(100 - Math.min(100, pBills), pAllow), pLeft
  ) + '%';

  /* legend */
  document.getElementById('leg-bills').textContent    = fmt(totalBills / div);
  document.getElementById('legpct-bills').textContent = pBills.toFixed(1) + '%';
  document.getElementById('leg-allow').textContent    = fmt(allow / div);
  document.getElementById('legpct-allow').textContent = pAllow.toFixed(1) + '%';
  document.getElementById('leg-left').textContent     = fmt(Math.max(0, leftover) / div);
  document.getElementById('legpct-left').textContent  = pLeft.toFixed(1) + '%';

  /* income card */
  document.getElementById('payroll-monthly').textContent = fmt(weekly * 4);
  document.getElementById('payroll-annual').textContent  = fmt(monthly * 12);

  /* spending card */
  document.getElementById('allow-total-monthly').textContent = fmt(allow);
  document.getElementById('allow-pct').textContent           = pAllow.toFixed(1) + '%';

  renderBills();
}

/* ── Init ── */
